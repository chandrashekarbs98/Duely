# Continuous Integration: on every push and pull request, prove the code still works.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # A throwaway Postgres just for this run.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker
      TEST_DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker_test
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters-long
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install ".[dev]"
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Tests (also applies every migration)
        run: pytest
      - name: Models match migrations
        run: DATABASE_URL="$TEST_DATABASE_URL" alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    # Make sure the production image still builds.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t personal-tracker .
