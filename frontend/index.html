<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal Tracker: to-dos and personal finance in one place."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Personal Tracker</title>
    <script>
      // Apply the saved theme before first paint, so dark mode doesn't flash white.
      try {
        var t = localStorage.getItem("tracker-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
